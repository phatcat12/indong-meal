<!DOCTYPE html>
<html>
  <body>
    <h1>인동고 급식앱 테스트</h1>
    <div id="meal"></div>
    <script>
        fetch("/api/meal")  // 나이스가 아니라 네 함수를 부름
            .then((res) => res.json())
            .then((data) => {
                const 급식 = data.mealServiceDietInfo[1].row[0].DDISH_NM;
                document.getElementById("meal").innerHTML = 급식;
            });
    </script>
  </body>
</html>
